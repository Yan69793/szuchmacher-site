      - generic [ref=e175]:
        - article [ref=e176]:
          - heading "Como o relatório semanal traduz vetores macro em decisões de carteira" [level=3] [ref=e177]
          - paragraph [ref=e178]: O fechamento publicado todo pregão integra três camadas. A primeira é o registro objetivo do que se moveu, índices brasileiros, paridades cambiais, juros americanos, commodities energéticas e metais preciosos, com magnitude e direção. A segunda é a leitura de causa, isolando o que foi reação a dado macro, prêmio de risco geopolítico, fluxo técnico ou rotação setorial. A terceira é a implicação para alocação, indicando onde a leitura altera ou não a tese de risco corrente.
          - paragraph [ref=e179]: O foco não é prever o próximo movimento. É garantir que a carteira não seja surpreendida por uma assimetria de informação dentro do próprio mercado em que ela está exposta. Os destaques do dia entram organizados por classe de ativo, com nota de contexto, e quando relevantes, comparativos contra o consenso de Reuters, Bloomberg e B3. O destinatário recebe a peça antes da abertura asiática, em formato curto e auditável.
          - generic [ref=e180]:
